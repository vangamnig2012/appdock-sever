<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appdock</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky search header, category chip rail, responsive card grid; app detail replaces the grid in place. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#121b24; --muted:#55636f; --line:#d9dfe5;
  --accent:#0a7d6e; --accent-ink:#ffffff; --soft:#e2efec;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --ink:#e8eef3; --muted:#93a1ad; --line:#26313b;
  --accent:#3cc5b0; --accent-ink:#06201c; --soft:#12302c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --ink:#e8eef3; --muted:#93a1ad; --line:#26313b;
  --accent:#3cc5b0; --accent-ink:#06201c; --soft:#12302c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:1100px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;background:none;border:0;padding:0}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.logo i::after{content:"";width:12px;height:12px;border:3px solid var(--accent-ink);border-top-color:transparent;border-radius:50%;transform:rotate(45deg)}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.search input::placeholder{color:var(--muted)}
.mono-btn{height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.mono-btn[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}

.intro{padding:36px 0 20px;display:grid;gap:8px}
.intro h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,52px);line-height:1.02;letter-spacing:-.03em;margin:0;max-width:16ch;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:56ch}

.filters{display:flex;flex-direction:column;gap:10px;padding:8px 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.plats{display:flex;gap:6px;flex-wrap:wrap}
.plat{padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;font-family:var(--f-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.plat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit}
.count{color:var(--muted);font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.top{display:flex;gap:12px;align-items:center;min-width:0}
.tile{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:24px}
.top h3{margin:0;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.top small{color:var(--muted);display:block;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:14px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--ink)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

.detail{display:grid;gap:24px;padding-top:24px}
.back{justify-self:start;background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600}
.dhead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dhead .tile{width:88px;height:88px;border-radius:24px;font-size:42px}
.dhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,42px);letter-spacing:-.03em;line-height:1.05;margin:0}
.dhead p{margin:4px 0 0;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:760px){.dbody{grid-template-columns:minmax(0,1fr)}}
.prose{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.prose h4,.facts h4{margin:0 0 8px;font-family:var(--f-display);font-size:18px}
.prose p{margin:0 0 12px;max-width:65ch}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.facts dl{margin:0;display:grid;gap:12px}
.facts dt{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);margin-top:14px;max-width:70ch}
h5{font-family:var(--f-display);font-size:18px;margin:8px 0 12px}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;max-width:70ch}
.add-btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.form{display:grid;gap:18px;padding-top:24px;max-width:720px}
.form h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:-.03em;line-height:1.05;margin:0}
.form>p{margin:0;color:var(--muted)}
.field{display:grid;gap:6px;min-width:0}
.field label,.field legend{font-weight:600;font-size:14px;padding:0}
.field input[type=text],.field input[type=url],.field textarea,.field select{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;height:auto}
.field input[type=text],.field input[type=url],.field select{height:44px;padding-block:0}
.field textarea{min-height:120px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
fieldset.field{border:0;margin:0;padding:0}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.err{color:#b3261e;font-size:14px;min-height:1.2em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
:root[data-theme="dark"] .err{color:#ff8a80}
.btn.danger{color:#b3261e;border-color:var(--line);background:transparent}
.btn.danger[data-armed="1"]{background:#b3261e;color:#fff;border-color:#b3261e}
.tag.added{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
<style>:root{color-scheme:light}html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="logo" id="home" type="button" aria-label="Appdock home"><i></i>Appdock</button>
    <div class="search"><input id="q" type="search" placeholder="Search apps, developers, categories" aria-label="Search apps" autocomplete="off"></div>
    <button class="mono-btn" id="savedBtn" type="button" aria-pressed="false">Saved <span id="savedN">0</span></button>
    <button class="mono-btn add-btn" id="addBtn" type="button">Add your app</button>
  </div>
</header>

<main class="wrap" id="main"></main>

<script>
const BASE=[
["firefox","Firefox","Mozilla","Browsers",["Windows","Mac","Linux","Android"],"Open source","A fast browser with tracking protection and sync.","Firefox is an independent browser built by the Mozilla Foundation's commercial arm. It blocks many trackers by default, supports extensions on desktop and Android, and syncs tabs, bookmarks and passwords across devices.","https://www.mozilla.org/firefox/"],
["brave","Brave","Brave Software","Browsers",["Windows","Mac","Linux","Android"],"Free","Chromium browser with built-in ad and tracker blocking.","Brave is based on Chromium, so Chrome extensions work. Ad and tracker blocking is on from the first launch, and it includes optional features such as a built-in VPN and rewards that you can switch off.","https://brave.com/download/"],
["vlc","VLC media player","VideoLAN","Media",["Windows","Mac","Linux","Android"],"Open source","Plays almost any video or audio file without extra codecs.","VLC plays local files, discs, network streams and webcams. It handles subtitles, audio sync adjustment and format conversion, and it has no ads or tracking.","https://www.videolan.org/vlc/"],
["spotify","Spotify","Spotify","Media",["Windows","Mac","Linux","Android"],"Freemium","Music and podcast streaming with a free ad-supported tier.","Spotify offers a large music and podcast catalog. The free tier includes ads and shuffle on mobile; Premium removes ads and adds offline listening.","https://www.spotify.com/download/"],
["obs","OBS Studio","OBS Project","Media",["Windows","Mac","Linux"],"Open source","Record and live-stream your screen, webcam and audio.","OBS Studio composes scenes from screen captures, cameras, images and audio sources, then records them or streams to services such as Twitch and YouTube. Plugins extend it further.","https://obsproject.com/download"],
["handbrake","HandBrake","HandBrake Team","Media",["Windows","Mac","Linux"],"Open source","Convert video between formats with ready-made presets.","HandBrake transcodes video for phones, TVs and web use. Presets pick sensible settings, and advanced options cover codecs, filters, chapters and batch queues.","https://handbrake.fr/downloads.php"],
["kdenlive","Kdenlive","KDE","Media",["Windows","Mac","Linux"],"Open source","Multi-track video editor with titles, effects and proxies.","Kdenlive is a non-linear video editor with multi-track timelines, keyframe effects, a title editor and proxy editing for heavy footage.","https://kdenlive.org/download/"],
["audacity","Audacity","Muse Group","Media",["Windows","Mac","Linux"],"Open source","Record and edit audio on a multi-track timeline.","Audacity records from microphones and line inputs, edits waveforms, and applies effects like noise reduction, normalization and equalization. It exports to common audio formats.","https://www.audacityteam.org/download/"],
["telegram","Telegram","Telegram","Communication",["Windows","Mac","Linux","Android"],"Free","Cloud-synced messenger with large groups and channels.","Telegram syncs chats across devices, supports groups of very large size, channels, bots and file sharing. Secret chats use end-to-end encryption.","https://telegram.org/apps"],
["signal","Signal","Signal Foundation","Communication",["Windows","Mac","Linux","Android"],"Open source","Private messenger with end-to-end encryption by default.","Signal encrypts messages and calls end to end by default, collects very little metadata, and is run by a nonprofit foundation.","https://signal.org/download/"],
["whatsapp","WhatsApp","Meta","Communication",["Windows","Mac","Android"],"Free","Messaging and calls using your phone number.","WhatsApp handles text, voice, video calls and group chats, with end-to-end encryption for personal messages.","https://www.whatsapp.com/download"],
["discord","Discord","Discord","Communication",["Windows","Mac","Linux","Android"],"Freemium","Voice, video and text chat organised into servers.","Discord groups conversations into servers with text channels, voice rooms and screen sharing. It is popular with gaming and hobby communities.","https://discord.com/download"],
["zoom","Zoom","Zoom","Communication",["Windows","Mac","Linux","Android"],"Freemium","Video meetings and webinars.","Zoom runs video meetings with screen sharing, breakout rooms and recording. The free plan limits the length of group meetings.","https://zoom.us/download"],
["slack","Slack","Salesforce","Communication",["Windows","Mac","Linux","Android"],"Freemium","Team chat organised by channel, with app integrations.","Slack organises team conversation into channels and threads, and connects to many work tools. The free plan has limits on history and integrations.","https://slack.com/downloads"],
["thunderbird","Thunderbird","MZLA","Productivity",["Windows","Mac","Linux"],"Open source","Email, calendar and contacts in one desktop app.","Thunderbird manages several email accounts with a unified inbox, calendar and address book, and supports add-ons.","https://www.thunderbird.net/"],
["libreoffice","LibreOffice","The Document Foundation","Productivity",["Windows","Mac","Linux"],"Open source","A full office suite that opens and saves Microsoft formats.","LibreOffice includes a word processor, spreadsheet, presentation tool, drawing app and database front end. It reads and writes .docx, .xlsx and .pptx files.","https://www.libreoffice.org/download/download-libreoffice/"],
["obsidian","Obsidian","Obsidian","Productivity",["Windows","Mac","Linux","Android"],"Free","Notes stored as plain Markdown files, linked together.","Obsidian keeps notes as local Markdown files in a folder you control. You can link notes, view a graph of connections, and add community plugins.","https://obsidian.md/download"],
["notepadpp","Notepad++","Don Ho","Developer",["Windows"],"Open source","Lightweight text and code editor for Windows.","Notepad++ opens quickly, highlights syntax for many languages, supports tabs, regular-expression search and plugins.","https://notepad-plus-plus.org/downloads/"],
["vscode","Visual Studio Code","Microsoft","Developer",["Windows","Mac","Linux"],"Free","Code editor with extensions, debugging and Git built in.","Visual Studio Code supports many languages through extensions, with an integrated terminal, debugger and source control.","https://code.visualstudio.com/Download"],
["gimp","GIMP","GIMP Team","Creative",["Windows","Mac","Linux"],"Open source","Photo editing and image retouching with layers and filters.","GIMP offers layers, masks, curves, selection tools and plug-ins for photo retouching and image composition.","https://www.gimp.org/downloads/"],
["inkscape","Inkscape","Inkscape Project","Creative",["Windows","Mac","Linux"],"Open source","Vector graphics editor that works with SVG.","Inkscape draws scalable vector graphics for logos, icons and illustrations, with path tools, text on a path and clone tiling.","https://inkscape.org/release/"],
["krita","Krita","KDE","Creative",["Windows","Mac","Linux","Android"],"Open source","Digital painting with a large brush library.","Krita is made for painting and illustration, with customizable brushes, stabilizers, animation tools and tablet support.","https://krita.org/en/download/"],
["blender","Blender","Blender Foundation","Creative",["Windows","Mac","Linux"],"Open source","3D modelling, animation, rendering and video editing.","Blender covers modelling, sculpting, rigging, animation, simulation and rendering, plus a video sequencer. It is free for any use.","https://www.blender.org/download/"],
["bitwarden","Bitwarden","Bitwarden","Security",["Windows","Mac","Linux","Android"],"Open source","Password manager with browser autofill and sync.","Bitwarden stores logins, cards and notes in an encrypted vault and fills them in your browser. The core features are free.","https://bitwarden.com/download/"],
["7zip","7-Zip","Igor Pavlov","Utilities",["Windows"],"Open source","File archiver for ZIP, 7z, RAR extraction and more.","7-Zip creates and opens 7z and ZIP archives and extracts many other formats. It integrates with the Windows right-click menu.","https://www.7-zip.org/download.html"],
["qbittorrent","qBittorrent","qBittorrent Project","Utilities",["Windows","Mac","Linux"],"Open source","BitTorrent client without ads, with a built-in search.","qBittorrent downloads torrents with queueing, bandwidth limits, RSS feeds and a web interface. Use it for content you have the right to download.","https://www.qbittorrent.org/download"],
["sharex","ShareX","ShareX Team","Utilities",["Windows"],"Open source","Screenshots and screen recording with upload shortcuts.","ShareX captures regions, windows or scrolling pages, records the screen to video or GIF, and can upload results to many services.","https://getsharex.com/downloads"],
["fdroid","F-Droid","F-Droid Limited","Utilities",["Android"],"Open source","An app store for free and open-source Android apps.","F-Droid is a catalog of open-source Android apps. Every app is built from public source code and listed with its anti-features.","https://f-droid.org/"],
["newpipe","NewPipe","NewPipe Team","Media",["Android"],"Open source","Lightweight YouTube client for Android with background play.","NewPipe plays and downloads videos and audio without Google services, supports background playback and subscriptions kept on the device.","https://newpipe.net/"],
["steam","Steam","Valve","Games",["Windows","Mac","Linux"],"Free","Game store and launcher with a large library.","Steam sells and launches PC games, handles updates and cloud saves, and includes friends lists and community features.","https://store.steampowered.com/about/"]
];
let APPS=BASE.slice();
const CAT_LIST=["Browsers","Communication","Media","Productivity","Developer","Creative","Security","Utilities","Games"];
const CATS=["All",...CAT_LIST];
const LICENSES=["Free","Open source","Freemium","Paid"];
const PLATS=["Windows","Mac","Linux","Android"];
const CUSTOM=new Map();
const KEY_STORE="appdock-keys";
let KEYS={};
try{KEYS=JSON.parse(localStorage.getItem(KEY_STORE)||"{}")||{}}catch(e){}
function saveKeys(){try{localStorage.setItem(KEY_STORE,JSON.stringify(KEYS))}catch(e){}}
const URL_OK=u=>/^https:\/\/[^\s"'<>]+$/.test(u)&&(()=>{try{return !!new URL(u).hostname.includes(".")}catch(e){return false}})();
function toTuple(id,d){
  if(!/^[a-z0-9-]{3,40}$/.test(id)||!d||typeof d!=="object")return null;
  const s=(v,n)=>typeof v==="string"?v.trim().slice(0,n):"";
  const name=s(d.name,60),dev=s(d.dev,60),tag=s(d.tag,140),desc=s(d.desc,1200),url=s(d.url,300);
  if(!name||!dev||!tag||!desc||!URL_OK(url))return null;
  const cat=CAT_LIST.includes(d.cat)?d.cat:"Utilities";
  const lic=LICENSES.includes(d.lic)?d.lic:"Free";
  const plats=Array.isArray(d.plats)?PLATS.filter(p=>d.plats.includes(p)):[];
  if(!plats.length)return null;
  return [id,esc(name),esc(dev),cat,plats,lic,esc(tag),esc(desc),esc(url),true,Number(d.t)||0];
}
function rebuild(){
  const extra=[];
  CUSTOM.forEach((d,id)=>{const t=toTuple(id,d);if(t)extra.push(t)});
  extra.sort((a,b)=>b[10]-a[10]);
  APPS=[...BASE,...extra];
}
async function loadApps(){
  try{
    const r=await fetch("/api/apps",{headers:{Accept:"application/json"},cache:"no-store"});
    if(!r.ok)throw new Error("bad status");
    const list=await r.json();
    CUSTOM.clear();
    list.forEach(d=>{if(d&&d.id)CUSTOM.set(d.id,d)});
  }catch(e){return false}
  rebuild();
  return true;
}
const $=s=>document.querySelector(s), main=$("#main");
const S={cat:"All",plat:new Set(),sort:"az",q:"",saved:false};
let saved=new Set();
try{saved=new Set(JSON.parse(localStorage.getItem("appdock-saved")||"[]"))}catch(e){}
function persist(){try{localStorage.setItem("appdock-saved",JSON.stringify([...saved]))}catch(e){}$("#savedN").textContent=saved.size}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const tile=a=>`<span class="tile" style="background:hsl(${hue(a[0])} 52% 36%)" aria-hidden="true">${a[1][0]}</span>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function list(){
  const t=S.q.trim().toLowerCase();
  let r=APPS.filter(a=>(S.cat==="All"||a[3]===S.cat)&&(!S.plat.size||[...S.plat].every(p=>a[4].includes(p)))&&(!S.saved||saved.has(a[0]))&&(!t||(a[1]+" "+a[2]+" "+a[3]+" "+a[6]).toLowerCase().includes(t)));
  r.sort((x,y)=>S.sort==="az"?x[1].localeCompare(y[1]):y[1].localeCompare(x[1]));
  return r;
}
function renderHome(keepFocus){
  const r=list();
  main.innerHTML=`
  <section class="intro"><h1>Find the app. Get it from the source.</h1>
  <p>${APPS.length} apps for Windows, Mac, Linux and Android. Each page links to the developer's own download page, so you always get the real installer.</p></section>
  <section class="filters">
    <div class="chips" role="group" aria-label="Categories">${CATS.map(c=>`<button class="chip" type="button" data-cat="${c}" aria-pressed="${S.cat===c}">${c}</button>`).join("")}</div>
    <div class="row2">
      <div class="plats" role="group" aria-label="Platforms">${PLATS.map(p=>`<button class="plat" type="button" data-plat="${p}" aria-pressed="${S.plat.has(p)}">${p}</button>`).join("")}</div>
      <div style="display:flex;gap:12px;align-items:center"><span class="count">${r.length} ${r.length===1?"app":"apps"}</span>
      <select id="sort" aria-label="Sort"><option value="az"${S.sort==="az"?" selected":""}>Name A to Z</option><option value="za"${S.sort==="za"?" selected":""}>Name Z to A</option></select></div>
    </div>
  </section>
  ${r.length?`<section class="grid">${r.map(a=>`<button class="card" type="button" data-app="${a[0]}">
    <span class="top">${tile(a)}<span style="min-width:0"><h3>${a[1]}</h3><small>${a[2]}</small></span></span>
    <p>${a[6]}</p>
    <span class="meta">${a[9]?'<span class="tag added">Added</span>':""}<span class="tag">${a[3]}</span><span class="tag">${a[5]}</span>${a[4].map(p=>`<span class="tag">${p}</span>`).join("")}</span></button>`).join("")}</section>`
  :`<div class="empty">${S.saved?"You have not saved any apps that match yet. Open an app and choose Save.":"No apps match that search. Try a different word or clear a platform filter."}</div>`}
  <footer>Appdock is a catalog. It does not host installers or Android packages. Download buttons open the developer's official page in a new tab. Apps marked Added were submitted by visitors and are not checked. Check each page for current versions, prices and system requirements.</footer>`;
}
function renderApp(id){
  const a=APPS.find(x=>x[0]===id); if(!a){renderHome();return}
  const rel=APPS.filter(x=>x[3]===a[3]&&x[0]!==a[0]).slice(0,4);
  main.innerHTML=`<article class="detail">
  <button class="back" type="button" id="back">&larr; All apps</button>
  <div class="dhead">${tile(a)}<div style="min-width:0"><h2>${a[1]}</h2><p>${a[2]} · ${a[3]}</p></div></div>
  <div class="cta"><a class="btn" href="${a[8]}" target="_blank" rel="noopener noreferrer">Get from official site</a>
  <button class="btn alt" type="button" id="save" aria-pressed="${saved.has(a[0])}">${saved.has(a[0])?"Saved":"Save"}</button>
  ${a[9]&&KEYS[a[0]]?`<button class="btn danger" type="button" id="remove" data-armed="0">Remove app</button>`:""}</div>
  <div class="err" id="derr" role="alert"></div>
  <div class="dbody"><div class="prose"><h4>About ${a[1]}</h4><p>${a[7]}</p><p class="note">${a[9]?`This app was added by a visitor, not checked by Appdock. The download button goes to ${new URL(a[8]).hostname}. Check the address before you install anything.`:`The download button goes to ${new URL(a[8]).hostname}, the developer's own site.`}</p></div>
  <aside class="facts"><h4>Details</h4><dl>
   <div><dt>Developer</dt><dd>${a[2]}</dd></div>
   <div><dt>License</dt><dd>${a[5]}</dd></div>
   <div><dt>Category</dt><dd>${a[3]}</dd></div>
   <div><dt>Platforms</dt><dd>${a[4].join(", ")}</dd></div>
   <div><dt>${a[9]?"Link goes to":"Official page"}</dt><dd>${new URL(a[8]).hostname}</dd></div></dl></aside></div>
  ${rel.length?`<section><h5>More in ${a[3]}</h5><div class="grid">${rel.map(b=>`<button class="card" type="button" data-app="${b[0]}"><span class="top">${tile(b)}<span style="min-width:0"><h3>${b[1]}</h3><small>${b[2]}</small></span></span><p>${b[6]}</p></button>`).join("")}</div></section>`:""}
  </article>`;
  document.title=a[1]+" · Appdock";
  window.scrollTo(0,0);
}
function renderForm(){
  document.title="Add your app · Appdock";
  main.innerHTML=`<form class="form" id="addForm" novalidate>
  <button class="back" type="button" id="back">&larr; All apps</button>
  <h2>Add your app</h2>
  <p>Your app appears in the catalog right away. The download button opens the link you enter, so use the page where people should get your app.</p>
  <div class="two">
    <div class="field"><label for="f-name">App name</label><input id="f-name" type="text" maxlength="60" required autocomplete="off"></div>
    <div class="field"><label for="f-dev">Developer or team</label><input id="f-dev" type="text" maxlength="60" required autocomplete="off"></div>
  </div>
  <div class="two">
    <div class="field"><label for="f-cat">Category</label><select id="f-cat">${CAT_LIST.map(c=>`<option>${c}</option>`).join("")}</select></div>
    <div class="field"><label for="f-lic">License</label><select id="f-lic">${LICENSES.map(c=>`<option>${c}</option>`).join("")}</select></div>
  </div>
  <fieldset class="field"><legend>Platforms</legend><div class="checks">${PLATS.map(p=>`<label><input type="checkbox" name="plat" value="${p}">${p}</label>`).join("")}</div></fieldset>
  <div class="field"><label for="f-tag">One-line summary</label><input id="f-tag" type="text" maxlength="140" required autocomplete="off"><span class="hint">Shown on the app card. Up to 140 characters.</span></div>
  <div class="field"><label for="f-desc">Description</label><textarea id="f-desc" maxlength="1200" required></textarea><span class="hint">What it does and who it is for. Up to 1200 characters.</span></div>
  <div class="field"><label for="f-url">Download page</label><input id="f-url" type="url" placeholder="https://example.com/download" required autocomplete="off"><span class="hint">Must start with https://</span></div>
  <div class="err" id="ferr" role="alert"></div>
  <div class="cta"><button class="btn" type="submit" id="submitBtn">Add to Appdock</button><button class="btn alt" type="button" id="cancel">Cancel</button></div>
  </form>`;
  window.scrollTo(0,0);
}
function route(){
  const id=decodeURIComponent((location.hash||"").slice(1));
  if(id==="add")renderForm();
  else if(id&&APPS.some(a=>a[0]===id))renderApp(id);else{document.title="Appdock";renderHome()}
}
function sync(){rebuild();if(decodeURIComponent((location.hash||"").slice(1))!=="add")route()}
async function submitApp(){
  const v=id=>document.getElementById(id).value.trim(), err=document.getElementById("ferr");
  const rec={name:v("f-name"),dev:v("f-dev"),cat:v("f-cat"),lic:v("f-lic"),
    plats:[...document.querySelectorAll('input[name=plat]:checked')].map(x=>x.value),
    tag:v("f-tag"),desc:v("f-desc"),url:v("f-url"),t:Date.now()};
  if(!rec.name||!rec.dev||!rec.tag||!rec.desc){err.textContent="Fill in the name, developer, summary and description.";return}
  if(!rec.plats.length){err.textContent="Choose at least one platform.";return}
  if(!URL_OK(rec.url)){err.textContent="Enter a full download link that starts with https://";return}
  err.textContent="";
  const btn=document.getElementById("submitBtn");btn.disabled=true;
  let res=null;
  try{res=await fetch("/api/apps",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)})}catch(e){}
  if(!res||!res.ok){
    let m="Could not reach the server. Try again in a moment.";
    if(res){try{const j=await res.json();if(j&&j.error)m=j.error}catch(e){}}
    err.textContent=m;btn.disabled=false;return;
  }
  const j=await res.json();
  CUSTOM.set(j.id,j.app);KEYS[j.id]=j.key;saveKeys();
  rebuild();open(j.id);
}
async function removeApp(id){
  const err=document.getElementById("derr");
  try{
    const r=await fetch("/api/apps/"+encodeURIComponent(id),{method:"DELETE",headers:{"X-Owner-Key":KEYS[id]||""}});
    if(!r.ok&&r.status!==404){err.textContent="You cannot remove this app.";return}
  }catch(e){err.textContent="Could not reach the server.";return}
  CUSTOM.delete(id);delete KEYS[id];saveKeys();rebuild();home();
}
function open(id){try{history.pushState(null,"","#"+id)}catch(e){}route()}
function home(){try{history.pushState(null,"",location.pathname)}catch(e){}route()}

main.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.app)return open(t.dataset.app);
  if(t.dataset.cat){S.cat=t.dataset.cat;return renderHome()}
  if(t.dataset.plat){const p=t.dataset.plat;S.plat.has(p)?S.plat.delete(p):S.plat.add(p);return renderHome()}
  if(t.id==="back"||t.id==="cancel")return home();
  if(t.id==="remove"){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Click again to remove";return}return removeApp(decodeURIComponent(location.hash.slice(1)))}
  if(t.id==="save"){const id=decodeURIComponent(location.hash.slice(1));saved.has(id)?saved.delete(id):saved.add(id);persist();return renderApp(id)}
});
main.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="addForm")submitApp()});
$("#addBtn").addEventListener("click",()=>open("add"));
main.addEventListener("change",e=>{if(e.target.id==="sort"){S.sort=e.target.value;renderHome()}});
$("#q").addEventListener("input",e=>{S.q=e.target.value;if(location.hash)home();else renderHome()});
$("#home").addEventListener("click",()=>{S.q="";$("#q").value="";S.cat="All";S.plat.clear();S.saved=false;$("#savedBtn").setAttribute("aria-pressed","false");home()});
$("#savedBtn").addEventListener("click",()=>{S.saved=!S.saved;$("#savedBtn").setAttribute("aria-pressed",S.saved);if(location.hash)home();else renderHome()});
window.addEventListener("popstate",route);
window.addEventListener("hashchange",route);
persist();route();
const sig=()=>[...CUSTOM.keys()].sort().join(",");
(async()=>{
  await loadApps();
  sync();
  setInterval(async()=>{
    const before=sig();
    if(await loadApps()&&sig()!==before)sync();
  },60000);
})();
</script>

</body>
</html>
